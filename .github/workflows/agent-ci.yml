# CI for the shipment triage agent.
name: agent-ci

# When to run: on every pull request into master, and manually from the Actions tab.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# The built-in GITHUB_TOKEN can only read the repo. CI never pushes or comments.
permissions:
  contents: read

jobs:
  # Job 1: fast checks, no model calls, no secrets.
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      # Download the repo onto the runner (a fresh Ubuntu VM).
      - uses: actions/checkout@v4

      # Install Node 22 and cache ~/.npm between runs, keyed on package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects this lockfile (written by npm 11).
      # Use the same npm as the Dockerfile and local machine.
      - run: npm install -g npm@11.9.0

      # Clean install of the exact versions in package-lock.json.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:schema

    # Job 2: promptfoo regression suite against real models.
  # "needs" makes it wait for schema-tests and skip if that job fails.
  evals:
    needs: schema-tests
    runs-on: ubuntu-latest
    env:
      # Secrets are masked in logs. Never echo them.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Model names aren't secret, so they come from repository variables.
      # Unset ones fall back to MODEL, then to openrouter/free (app/client.ts).
      MODEL: ${{ vars.MODEL }}
      MODEL_SMALL: ${{ vars.MODEL_SMALL }}
      MODEL_STRONG: ${{ vars.MODEL_STRONG }}
      MODEL_BACKUP: ${{ vars.MODEL_BACKUP }}
      # No LANGFUSE_* keys are set, so tracing stays off.
    steps:
      # Each job runs on its own fresh VM, so checkout and install happen again.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects this lockfile (written by npm 11).
      # Use the same npm as the Dockerfile and local machine.
      - run: npm install -g npm@11.9.0

      - run: npm ci

      # The agent's tools live in a separate MCP server on port 3002.
      # Start it in the background (&), then retry until it accepts connections.
      - name: Start MCP tool server
        run: |
          npm run mcp:start &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3002/mcp

      # First 3 golden cases, one at a time. promptfoo exits non-zero
      # when any case fails, and a non-zero exit fails the job.
      - run: npm run evals:ci