# CI for the shipment triage agent.
name: agent-ci

# When to run: on every pull request into master, and manually from the Actions tab.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# The built-in GITHUB_TOKEN can only read the repo. CI never pushes or comments.
permissions:
  contents: read

jobs:
  # Job 1: fast checks, no model calls, no secrets.
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      # Download the repo onto the runner (a fresh Ubuntu VM).
      - uses: actions/checkout@v4

      # Install Node 22 and cache ~/.npm between runs, keyed on package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects this lockfile (written by npm 11).
      # Use the same npm as the Dockerfile and local machine.
      - run: npm install -g npm@11.9.0

      # Clean install of the exact versions in package-lock.json.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:schema
