name: agent-ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:schema

  evals:
    needs: schema-tests
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      
      MODEL: ${{ vars.MODEL }}
      MODEL_SMALL: ${{ vars.MODEL_SMALL }}
      MODEL_STRONG: ${{ vars.MODEL_STRONG }}
      MODEL_BACKUP: ${{ vars.MODEL_BACKUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - run: npm install -g npm@11.9.0
      - run: npm ci

      - name: Start MCP tool server
        run: |
          npm run mcp:start &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3002/mcp
      
      - run: npm run evals:ci