# Postgres for the LangGraph checkpointer.
# Start:  docker compose up -d      Stop:  docker compose down
# Data lives in the named volume, so checkpoints survive container restarts.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
